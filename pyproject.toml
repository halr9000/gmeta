[project]
name = "gallery-vlm-cli"
version = "0.1.0"
description = "Generate VLM captions and tags and write gallery-compatible XMP metadata"
requires-python = ">=3.11"
dependencies = ["typer>=0.16", "rich>=14", "httpx>=0.28"]

[project.scripts]
gmeta = "gallery_vlm.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gallery_vlm"]
