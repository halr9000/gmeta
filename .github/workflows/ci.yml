name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run gmeta --help
      - run: uv run python scripts/generate_docs.py
      - run: git diff --exit-code docs/parameters.md
      - run: uv build
